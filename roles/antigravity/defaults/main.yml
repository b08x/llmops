---
# defaults file for b08x.llmops.antigravity

# The state of the Antigravity tools: present, absent, or latest
antigravity_state: present

# Variable that will be displayed in debug output
# This demonstrates proper role variable naming with the 'run_' prefix
antigravity_my_variable: "default_value"

# URLs for Antigravity tools
antigravity_hub_url: "https://storage.googleapis.com/antigravity-public/antigravity-hub/2.11.0-6376446768316416/linux-x64/Antigravity.tar.gz"
antigravity_ide_url: "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.5.5-4923483625488384/linux-x64/Antigravity%20IDE.tar.gz"
antigravity_cli_install_url: "https://antigravity.google/cli/install.sh"
