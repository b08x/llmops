---
# uninstall tasks for antigravity tools

- name: Remove Antigravity directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /opt/antigravity
    - /opt/antigravity-ide
    - "{{ user.home }}/.gemini/antigravity-cli"

- name: Remove Antigravity CLI binaries
  ansible.builtin.file:
    path: "{{ user.home }}/.local/bin/agy"
    state: absent

- name: Remove desktop files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /usr/share/applications/antigravity.desktop
    - /usr/share/applications/antigravity-ide.desktop
